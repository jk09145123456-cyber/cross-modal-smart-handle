[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-handle"
dynamic = ["version"]
description = "Smart handle: audio event detection for Raspberry Pi with a PC AI server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
client = ["scipy", "sounddevice", "pyserial"]
server = ["faster-whisper", "tensorflow", "tensorflow-hub"]
dev = ["pytest"]

[project.scripts]
smart-handle-client = "smart_handle.client.cli:main"
smart-handle-server = "smart_handle.server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "smart_handle.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
